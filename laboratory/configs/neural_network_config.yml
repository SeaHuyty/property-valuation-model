# Price MLP (engines/neural_network). Paths are relative to laboratory/.
data:
  path: data/clean/data.csv
  target: price_usd
  test_size: 0.2        
  val_size: 0.1         
  seed: 42             
  # repeated hold-out: one full run per seed (new split + new init), reported as mean +- std.
  seeds: [42, 7, 13, 21, 99]

features:
  categorical: [property_type, province, district, commune, borey_name, title_deed]
  numeric: [area_m2, land_width_m, land_length_m, floor_level, bedrooms, bathrooms]
  log: [area_m2, land_width_m, land_length_m]
  # 0/1 flags, passed through unscaled
  binary: [in_borey, has_gym, has_lift, has_parking, has_pool, has_sauna, on_main_road,
           area_m2_missing, bedrooms_missing, bathrooms_missing, floor_level_missing, land_dims_missing]
  # categories seen fewer times than this in training map to id 0 ("other", shared with unseen values)
  min_count: 5
  max_embedding_dim: 16

model:
  numeric_hidden: 32          # dense layer for the numeric branch
  hidden: [256, 128, 64]      # dense layers after concatenation
  dropout: 0.25
  embedding_dropout: 0.1
  activation: leaky_relu      # relu | leaky_relu

train:
  batch_size: 256
  epochs: 300
  lr: 0.001
  weight_decay: 0.0001
  loss: huber                 # mse | huber (on log price)
  huber_delta: 1.0
  patience: 30                # early stopping on validation loss
  lr_patience: 10             # ReduceLROnPlateau
  lr_factor: 0.5

output_dir: models/neural_network
